# Luau linter config. `std = "roblox"` teaches Selene about game/workspace/Instance
# etc. The roblox.yml standard library is generated by `selene generate-roblox-std`
# (it's gitignored; CI regenerates it).
std = "roblox"

[rules]
unused_variable = "warn"
shadowing = "warn"
undefined_variable = "deny"
unscoped_variables = "deny"
deprecated = "warn"
global_usage = "warn"
empty_if = "warn"
empty_loop = "warn"
almost_swapped = "warn"
bad_string_escape = "deny"
compare_nan = "deny"
constant_table_comparison = "warn"
manual_table_clone = "warn"
mismatched_arg_count = "warn"
must_use = "warn"
roblox_incorrect_color3_new_bounds = "warn"
suspicious_reverse_loop = "warn"
